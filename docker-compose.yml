services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      VIGILO_CORS_ORIGINS: http://localhost:3000
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_VIGILO_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
