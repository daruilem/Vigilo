name: Vigilo security check-up
description: Passive security check-up of a website (TLS, headers, exposed files, email, platform), with the grade and fixes in the job summary.
author: Daruilem
branding:
  icon: shield
  color: blue

inputs:
  target:
    description: Website to check (domain or URL). Only check sites you run or are allowed to test.
    required: true
  fail-under:
    description: Fail the step when the score (0-100) is below this value. Empty means never fail.
    required: false
    default: ""
  lang:
    description: Language of the summary (en, fr, de or ar).
    required: false
    default: en
  platform:
    description: Hosting whose fixes are shown (apache, nginx, cloudflare or wordpress).
    required: false
    default: apache
  summary:
    description: Write the report to the job summary (true or false).
    required: false
    default: "true"
  allow-private:
    description: >-
      Allow targets that resolve to private addresses, such as a staging container
      started earlier in the same job (true or false).
    required: false
    default: "false"

outputs:
  score:
    description: Score from 0 to 100.
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: Letter grade from A to F.
    value: ${{ steps.scan.outputs.grade }}
  report:
    description: Path of the JSON report.
    value: ${{ steps.scan.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Vigilo
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"

    # Inputs reach the shell only through environment variables, never by expression
    # substitution inside the script, so a crafted input cannot inject commands.
    - id: scan
      name: Check the website
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        FAIL_UNDER: ${{ inputs.fail-under }}
        VIGILO_LANG: ${{ inputs.lang }}
        PLATFORM: ${{ inputs.platform }}
        SUMMARY: ${{ inputs.summary }}
        ALLOW_PRIVATE: ${{ inputs.allow-private }}
      run: |
        report="$RUNNER_TEMP/vigilo-report.json"
        args=(scan "$TARGET" --json --lang "$VIGILO_LANG" --platform "$PLATFORM")
        if [ "$SUMMARY" = "true" ]; then args+=(--markdown "$GITHUB_STEP_SUMMARY"); fi
        if [ -n "$FAIL_UNDER" ]; then args+=(--fail-under "$FAIL_UNDER"); fi
        if [ "$ALLOW_PRIVATE" = "true" ]; then args+=(--allow-private); fi

        # Exit codes: 0 done, 1 the scan could not run (reason on stderr), 2 score too low.
        status=0
        vigilo "${args[@]}" > "$report" || status=$?
        if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
          echo "::error title=Vigilo::The website could not be checked, see the log above."
          exit "$status"
        fi

        python - "$report" >> "$GITHUB_OUTPUT" <<'EOF'
        import json, sys
        report = json.load(open(sys.argv[1], encoding="utf-8"))
        print(f"score={report['score']}")
        print(f"grade={report['grade']}")
        EOF
        echo "report=$report" >> "$GITHUB_OUTPUT"

        if [ "$status" -eq 2 ]; then
          score=$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['score'])" "$report")
          echo "::error title=Vigilo::Score $score is below the required $FAIL_UNDER."
          exit 2
        fi
