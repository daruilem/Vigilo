name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest --cov=vigilo --cov-report=term-missing

  action:
    # Runs this repository's GitHub Action against a throwaway local web server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Local test site
        run: |
          echo "127.0.0.1 selftest.vigilo.test" | sudo tee -a /etc/hosts
          mkdir site && echo "<html lang=en><title>test</title></html>" > site/index.html
          sudo python3 -m http.server 80 --bind 127.0.0.1 --directory site > /dev/null 2>&1 &
          until curl -s -o /dev/null http://selftest.vigilo.test/; do sleep 1; done
      - id: vigilo
        uses: ./
        with:
          target: selftest.vigilo.test
          allow-private: "true"
          lang: de
      - id: strict
        uses: ./
        continue-on-error: true
        with:
          target: selftest.vigilo.test
          allow-private: "true"
          fail-under: "101"
          summary: "false"
      - name: Check the outputs
        env:
          GRADE: ${{ steps.vigilo.outputs.grade }}
          SCORE: ${{ steps.vigilo.outputs.score }}
          REPORT: ${{ steps.vigilo.outputs.report }}
          STRICT: ${{ steps.strict.outcome }}
        run: |
          echo "grade=$GRADE score=$SCORE strict=$STRICT"
          [[ "$GRADE" =~ ^[A-F]$ ]]
          [ -s "$REPORT" ]
          [ "$STRICT" = "failure" ]

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t vigilo-api .
      - run: docker build -t vigilo-web web

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser tests (Playwright, axe)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
