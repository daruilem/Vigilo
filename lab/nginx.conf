# Front of the lab: serves the ownership proof file, passes everything else to Juice Shop.
server {
    listen 80;
    server_name juice.lab _;

    # Proof of ownership: lab/www/vigilo-<id>.txt is served at /vigilo-<id>.txt
    location ~ ^/vigilo-[A-Za-z0-9_-]+\.txt$ {
        root /srv/www;
        default_type text/plain;
    }

    location / {
        proxy_pass http://juice-shop:3000;
        proxy_set_header Host $host;
    }
}
